<script id="capivaraPreservaChavesV39">
(function () {
  const SERVER = 'https://capivara-radio-server.onrender.com';
  const $ = id => document.getElementById(id);

  const configured = {
    text: {1:false,2:false,3:false},
    voice:{1:false,2:false,3:false}
  };

  function value(id){
    return String($(id)?.value || '').trim();
  }

  function checked(id){
    return !!$(id)?.checked;
  }

  function setSavedField(input, isConfigured, masked){
    if(!input) return;

    if(isConfigured){
      input.value = '';
      input.placeholder = masked
        ? 'CHAVE JÁ SALVA • ' + masked
        : 'CHAVE JÁ SALVA NO SERVIDOR';
      input.dataset.configured = '1';
    }else{
      input.dataset.configured = '0';
    }
  }

  async function readResponse(r){
    const text = await r.text();
    let data = {};

    try{
      data = text ? JSON.parse(text) : {};
    }catch(_){
      data = {raw:text};
    }

    if(!r.ok){
      throw new Error(
        data.error ||
        data.message ||
        data.raw ||
        ('HTTP ' + r.status)
      );
    }

    return data;
  }

  async function loadSavedSettings(){
    try{
      const r = await fetch(
        SERVER + '/api/admin/settings'
      );

      const j = await readResponse(r);
      const c = j.settings || j.data || j || {};

      const textPool = c.apiPool?.text || [];
      const voicePool = c.apiPool?.voice || [];
      const voices = c.voices || {};
      const programming = c.programming || {};

      for(let i=1;i<=3;i++){
        const item =
          textPool.find(
            x => Number(x.slot) === i
          ) || textPool[i-1] || {};

        configured.text[i] = !!item.configured;

        if($('textKeyOn'+i)){
          $('textKeyOn'+i).checked =
            item.enabled !== undefined
              ? !!item.enabled
              : $('textKeyOn'+i).checked;
        }

        setSavedField(
          $('textKey'+i),
          configured.text[i],
          item.masked || ''
        );
      }

      for(let i=1;i<=3;i++){
        const item =
          voicePool.find(
            x => Number(x.slot) === i
          ) || voicePool[i-1] || {};

        configured.voice[i] = !!item.configured;

        if($('voiceKeyOn'+i)){
          $('voiceKeyOn'+i).checked =
            item.enabled !== undefined
              ? !!item.enabled
              : $('voiceKeyOn'+i).checked;
        }

        setSavedField(
          $('voiceKey'+i),
          configured.voice[i],
          item.masked || ''
        );
      }

      if(
        voices.adMale &&
        $('voiceAdMaleV34')
      ){
        $('voiceAdMaleV34').value =
          voices.adMale;
      }

      if(
        voices.adFemale &&
        $('voiceAdFemaleV34')
      ){
        $('voiceAdFemaleV34').value =
          voices.adFemale;
      }

      if(
        voices.jingleMale &&
        $('voiceJingleMaleV34')
      ){
        $('voiceJingleMaleV34').value =
          voices.jingleMale;
      }

      if(
        voices.jingleFemale &&
        $('voiceJingleFemaleV34')
      ){
        $('voiceJingleFemaleV34').value =
          voices.jingleFemale;
      }

      if(
        programming.defaultAdsPerBlock !== undefined &&
        $('defaultAdsPerBlock')
      ){
        $('defaultAdsPerBlock').value =
          programming.defaultAdsPerBlock;
      }

      if(
        programming.dailyLimit !== undefined &&
        $('dailyLimit')
      ){
        $('dailyLimit').value =
          programming.dailyLimit;
      }

      if(
        programming.weeklyLimit !== undefined &&
        $('weeklyLimit')
      ){
        $('weeklyLimit').value =
          programming.weeklyLimit;
      }

      if(
        programming.topDailyLimit !== undefined &&
        $('topDailyLimit')
      ){
        $('topDailyLimit').value =
          programming.topDailyLimit;
      }

      const status = $('centralStatusV34');

      if(status){
        status.textContent =
          '🟢 Configurações carregadas';

        status.style.background =
          '#173b2c';

        status.style.color =
          '#bff7d2';
      }

    }catch(e){
      console.error(
        'Erro carregando configurações:',
        e
      );
    }
  }

  async function testGemini(){
    const r = await fetch(
      SERVER + '/api/ai/generate',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          item:'coxão mole',
          price:'29,90',
          ramo:'Açougue',
          maxChars:150
        })
      }
    );

    const data = await readResponse(r);

    if(data.ok === false){
      throw new Error(
        data.error ||
        'Gemini não respondeu.'
      );
    }

    return true;
  }

  async function testElevenLabs(){
    const r = await fetch(
      SERVER + '/api/voice/generate',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          text:'teste de conexão',
          voiceType:'adMale'
        })
      }
    );

    if(!r.ok){
      const text = await r.text();

      let data = {};

      try{
        data = text
          ? JSON.parse(text)
          : {};
      }catch(_){
        data = {raw:text};
      }

      throw new Error(
        data.error ||
        data.message ||
        data.raw ||
        ('HTTP ' + r.status)
      );
    }

    const contentType =
      String(
        r.headers.get('content-type') || ''
      ).toLowerCase();

    if(
      !contentType.includes(
        'application/json'
      )
    ){
      const blob = await r.blob();

      if(!blob.size){
        throw new Error(
          'ElevenLabs retornou áudio vazio.'
        );
      }
    }else{
      const data = await r.json();

      if(data.ok === false){
        throw new Error(
          data.error ||
          'Falha na ElevenLabs.'
        );
      }
    }

    return true;
  }

  window.capSaveCentralV34 =
  async function(){

    const button =
      $('saveCentralV34');

    const result =
      $('apiTestResult');

    const copy =
      $('copyApiError');

    const status =
      $('centralStatusV34');

    if(button){
      button.disabled = true;
      button.textContent =
        'SALVANDO E TESTANDO...';
    }

    if(copy){
      copy.style.display =
        'none';
    }

    try{
      const textPool = [];

      for(let i=1;i<=3;i++){
        textPool.push({
          slot:i,
          enabled:
            checked('textKeyOn'+i),
          key:
            value('textKey'+i)
        });
      }

      const voicePool = [];

      for(let i=1;i<=3;i++){
        voicePool.push({
          slot:i,
          enabled:
            checked('voiceKeyOn'+i),
          key:
            value('voiceKey'+i)
        });
      }

      const hasText =
        textPool.some(
          x =>
            x.enabled &&
            (
              x.key ||
              configured.text[x.slot]
            )
        );

      if(!hasText){
        throw new Error(
          'Ative pelo menos uma chave Gemini já salva ou digite uma nova.'
        );
      }

      const hasVoice =
        voicePool.some(
          x =>
            x.enabled &&
            (
              x.key ||
              configured.voice[x.slot]
            )
        );

      if(!hasVoice){
        throw new Error(
          'Ative pelo menos uma chave ElevenLabs já salva ou digite uma nova.'
        );
      }

      const voices = {
        adMale:
          value('voiceAdMaleV34'),

        adFemale:
          value('voiceAdFemaleV34'),

        jingleMale:
          value('voiceJingleMaleV34'),

        jingleFemale:
          value('voiceJingleFemaleV34')
      };

      if(
        Object.values(voices)
        .some(x => !x)
      ){
        throw new Error(
          'Preencha os 4 IDs de voz.'
        );
      }

      const programming = {
        defaultAdsPerBlock:
          Math.max(
            1,
            parseInt(
              value('defaultAdsPerBlock') ||
              '3',
              10
            )
          ),

        dailyLimit:
          Math.max(
            1,
            parseInt(
              value('dailyLimit') ||
              '15',
              10
            )
          ),

        weeklyLimit:
          Math.max(
            1,
            parseInt(
              value('weeklyLimit') ||
              '75',
              10
            )
          ),

        topDailyLimit:
          Math.max(
            0,
            parseInt(
              value('topDailyLimit') ||
              '1',
              10
            )
          )
      };

      if(result){
        result.textContent =
          'Salvando configurações no servidor...';
      }

      /*
       IMPORTANTE:
       chave vazia NÃO apaga a chave antiga.
       O servidor preserva a chave já salva.
      */
      const saveResponse =
        await fetch(
          SERVER +
          '/api/admin/settings',
          {
            method:'PUT',
            headers:{
              'Content-Type':
                'application/json'
            },
            body:JSON.stringify({
              apiPool:{
                text:textPool,
                voice:voicePool
              },
              voices,
              programming
            })
          }
        );

      await readResponse(
        saveResponse
      );

      if(status){
        status.textContent =
          '🟡 Testando APIs...';

        status.style.background =
          '#453b16';

        status.style.color =
          '#ffe69c';
      }

      const lines = [
        '✅ Configurações salvas no servidor.'
      ];

      const errors = [];

      try{
        await testGemini();

        lines.push(
          '✅ Gemini: teste real OK.'
        );
      }catch(e){
        errors.push(
          '❌ Gemini: ' +
          e.message
        );
      }

      try{
        await testElevenLabs();

        lines.push(
          '✅ ElevenLabs: teste real de áudio OK.'
        );
      }catch(e){
        errors.push(
          '❌ ElevenLabs: ' +
          e.message
        );
      }

      if(errors.length){
        if(result){
          result.textContent =
            lines
            .concat(
              [''],
              errors
            )
            .join('\n');
        }

        if(copy){
          copy.style.display =
            'inline-block';
        }

        if(status){
          status.textContent =
            '⚠ Salvo • teste com erro';

          status.style.background =
            '#442323';

          status.style.color =
            '#ffc1c1';
        }
      }else{
        if(result){
          result.textContent =
            lines
            .concat([
              '',
              '🎉 TUDO CERTO. GEMINI E ELEVENLABS FUNCIONANDO.'
            ])
            .join('\n');
        }

        if(status){
          status.textContent =
            '🟢 Salvo e testado';

          status.style.background =
            '#173b2c';

          status.style.color =
            '#bff7d2';
        }
      }

      await loadSavedSettings();

    }catch(e){
      if(result){
        result.textContent =
          '❌ Não foi possível salvar/testar.\n' +
          e.message;
      }

      if(copy){
        copy.style.display =
          'inline-block';
      }

      if(status){
        status.textContent =
          '⚠ ' + e.message;

        status.style.background =
          '#442323';

        status.style.color =
          '#ffc1c1';
      }
    }finally{
      if(button){
        button.disabled = false;
        button.textContent =
          '💾 SALVAR E TESTAR';
      }
    }
  };

  function prepareInputs(){
    for(let i=1;i<=3;i++){
      const text = $('textKey'+i);
      const voice = $('voiceKey'+i);

      if(text){
        text.addEventListener(
          'input',
          function(){
            if(this.value.trim()){
              this.dataset.configured =
                '1';
            }
          }
        );
      }

      if(voice){
        voice.addEventListener(
          'input',
          function(){
            if(this.value.trim()){
              this.dataset.configured =
                '1';
            }
          }
        );
      }
    }
  }

  if(
    document.readyState ===
    'loading'
  ){
    document.addEventListener(
      'DOMContentLoaded',
      function(){
        prepareInputs();

        setTimeout(
          loadSavedSettings,
          300
        );
      },
      {once:true}
    );
  }else{
    prepareInputs();

    setTimeout(
      loadSavedSettings,
      300
    );
  }

})();
</script>
