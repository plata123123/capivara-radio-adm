CAPIVARA RÁDIO ADM — FUNDOS ONLINE
COLE ESTE BLOCO NO index.html DO ADM,
IMEDIATAMENTE ANTES DE </body>

<style id="capFundosOnlineV52Css">

<script id="capFundosOnlineV52">
(function(){

const SERVER =
  'https://capivara-radio-server.onrender.com';

let fundosV52 = [];
let fundoTocandoV52 = null;

/* =========================================================
   SENHA DO ADM
========================================================= */

function adminPasswordV52(){

  return (
    sessionStorage.getItem(
      'capivara_admin_password_v38'
    ) ||
    sessionStorage.getItem(
      'capivara_admin_password'
    ) ||
    ''
  );
}

/* =========================================================
   API
========================================================= */

async function apiV52(path,options={}){

  const headers =
    new Headers(
      options.headers || {}
    );

  const password =
    adminPasswordV52();

  if(password){
    headers.set(
      'X-Admin-Password',
      password
    );
  }

  const response =
    await fetch(
      SERVER + path,
      {
        ...options,
        headers
      }
    );

  const type =
    response.headers
      .get('content-type') || '';

  let data = null;

  if(
    type.includes(
      'application/json'
    )
  ){
    try{
      data =
        await response.json();
    }catch(e){
      data = {};
    }
  }else{
    try{
      data =
        await response.text();
    }catch(e){
      data = '';
    }
  }

  if(!response.ok){

    const msg =
      data?.error ||
      data?.message ||
      (
        typeof data === 'string'
          ? data
          : ''
      ) ||
      (
        'Erro HTTP ' +
        response.status
      );

    throw new Error(msg);
  }

  return data;
}

/* =========================================================
   HELPERS
========================================================= */

function escV52(value){

  return String(
    value || ''
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');
}

function sizeV52(bytes){

  const n =
    Number(bytes || 0);

  if(!n){
    return '';
  }

  if(n < 1024){
    return n + ' B';
  }

  if(n < 1048576){
    return (
      (n / 1024)
        .toFixed(0) +
      ' KB'
    );
  }

  return (
    (n / 1048576)
      .toFixed(1) +
    ' MB'
  );
}

/* =========================================================
   LOCALIZAR ABA DE FUNDOS
========================================================= */

function backgroundsHostV52(){

  return (
    document.getElementById(
      'acBackgroundsV9'
    ) ||
    document.querySelector(
      '[data-acervo="backgrounds"]'
    )
  );
}

/* =========================================================
   CRIAR INTERFACE
========================================================= */

function ensureBackgroundUiV52(){

  const host =
    backgroundsHostV52();

  if(!host){
    return null;
  }

  /*
    Esconde somente a interface antiga
    de fundos. Não mexe em músicas
    nem playlists.
  */

  const oldList =
    document.getElementById(
      'backgroundListV9'
    );

  if(oldList){
    oldList.style.display =
      'none';
  }

  const oldInputs =
    host.querySelectorAll(
      'input[type="file"]'
    );

  oldInputs.forEach(input=>{

    const label =
      input.closest('label');

    if(label){
      label.style.display =
        'none';
    }
  });

  let box =
    document.getElementById(
      'capFundosOnlineV52'
    );

  if(box){
    return box;
  }

  box =
    document.createElement(
      'div'
    );

  box.id =
    'capFundosOnlineV52';

  box.innerHTML = `
    <div class="cap-bg-head">

      <div>
        <h3>
          🎙️ Fundos de Locução
        </h3>

        <div class="sub">
          Áudios usados em volume baixo atrás dos anúncios.
        </div>
      </div>

      <label
        class="btn"
        style="cursor:pointer"
      >
        + ADICIONAR FUNDOS

        <input
          id="capBgUploadV52"
          type="file"
          accept="audio/*"
          multiple
          hidden
        >
      </label>

    </div>

    <div
      id="capBgListV52"
    ></div>

    <div
      id="capBgStatusV52"
      class="cap-bg-status"
    ></div>
  `;

  host.appendChild(box);

  const upload =
    document.getElementById(
      'capBgUploadV52'
    );

  if(upload){

    upload.addEventListener(
      'change',
      async function(){

        const files =
          [
            ...(
              this.files ||
              []
            )
          ];

        if(!files.length){
          return;
        }

        await uploadBackgroundsV52(
          files
        );

        this.value = '';
      }
    );
  }

  return box;
}

/* =========================================================
   CARREGAR FUNDOS ONLINE
========================================================= */

async function loadBackgroundsV52(){

  ensureBackgroundUiV52();

  const status =
    document.getElementById(
      'capBgStatusV52'
    );

  if(status){
    status.textContent =
      'Carregando fundos...';
  }

  try{

    const response =
      await fetch(
        SERVER +
        '/api/media?kind=background',
        {
          headers:{
            Accept:
              'application/json'
          }
        }
      );

    let data = {};

    try{
      data =
        await response.json();
    }catch(e){}

    if(!response.ok){
      throw new Error(
        data?.error ||
        data?.message ||
        (
          'Erro HTTP ' +
          response.status
        )
      );
    }

    const list =
      Array.isArray(data)
        ? data
        : (
            Array.isArray(
              data?.media
            )
              ? data.media
              : []
          );

    fundosV52 =
      list.filter(item=>{

        const kind =
          String(
            item?.kind ||
            ''
          ).toLowerCase();

        return (
          kind ===
          'background'
        );
      });

    renderBackgroundsV52();

  }catch(error){

    console.error(
      'Fundos online:',
      error
    );

    if(status){
      status.textContent =
        '❌ Não foi possível carregar os fundos.';
    }

    const list =
      document.getElementById(
        'capBgListV52'
      );

    if(list){
      list.innerHTML = `
        <div class="cap-bg-empty">
          Não foi possível carregar os fundos online.
        </div>
      `;
    }
  }
}

/* =========================================================
   RENDER
========================================================= */

function renderBackgroundsV52(){

  ensureBackgroundUiV52();

  const list =
    document.getElementById(
      'capBgListV52'
    );

  const status =
    document.getElementById(
      'capBgStatusV52'
    );

  if(!list){
    return;
  }

  const counter =
    document.getElementById(
      'bgCountV9'
    );

  if(counter){
    counter.textContent =
      fundosV52.length;
  }

  if(!fundosV52.length){

    list.innerHTML = `
      <div class="cap-bg-empty">
        Nenhum fundo de locução salvo.
        <br>
        <b>
          Use “+ ADICIONAR FUNDOS”.
        </b>
      </div>
    `;

    if(status){
      status.textContent =
        '0 fundos online';
    }

    return;
  }

  list.innerHTML =
    fundosV52
      .map(item=>{

        const meta =
          [
            sizeV52(
              item.sizeBytes ||
              item.size_bytes ||
              item.size
            ),
            'ONLINE'
          ]
          .filter(Boolean)
          .join(' • ');

        return `
          <div
            class="cap-bg-row"
          >

            <div
              class="cap-bg-icon"
            >
              🎙️
            </div>

            <div>
              <div
                class="cap-bg-name"
              >
                ${escV52(
                  item.name ||
                  'Fundo de locução'
                )}
              </div>

              <div
                class="cap-bg-meta"
              >
                ${escV52(meta)}
              </div>
            </div>

            <div
              class="cap-bg-actions"
            >

              <button
                type="button"
                class="btn secondary"
                onclick="capPlayBackgroundV52('${String(
                  item.id
                ).replace(/'/g,"\\'")}')"
              >
                ▶ Ouvir
              </button>

              <button
                type="button"
                class="btn danger"
                onclick="capDeleteBackgroundV52('${String(
                  item.id
                ).replace(/'/g,"\\'")}')"
              >
                🗑 Excluir
              </button>

            </div>

          </div>
        `;
      })
      .join('');

  if(status){

    status.textContent =
      '🟢 ' +
      fundosV52.length +
      ' fundo' +
      (
        fundosV52.length === 1
          ? ''
          : 's'
      ) +
      ' online';
  }
}

/* =========================================================
   UPLOAD
========================================================= */

async function uploadBackgroundsV52(
  files
){

  ensureBackgroundUiV52();

  const status =
    document.getElementById(
      'capBgStatusV52'
    );

  for(
    let i = 0;
    i < files.length;
    i++
  ){

    const file =
      files[i];

    if(status){

      status.textContent =
        'Enviando ' +
        (i + 1) +
        ' de ' +
        files.length +
        ' • ' +
        file.name;
    }

    try{

      const url =
        SERVER +
        '/api/admin/media' +
        '?kind=background' +
        '&name=' +
        encodeURIComponent(
          file.name
        );

      const headers =
        new Headers();

      const password =
        adminPasswordV52();

      if(password){

        headers.set(
          'X-Admin-Password',
          password
        );
      }

      headers.set(
        'Content-Type',
        file.type ||
        'audio/mpeg'
      );

      headers.set(
        'X-Media-Kind',
        'background'
      );

      headers.set(
        'X-File-Name',
        encodeURIComponent(
          file.name
        )
      );

      const response =
        await fetch(
          url,
          {
            method:'POST',
            headers,
            body:file
          }
        );

      let data = {};

      try{
        data =
          await response.json();
      }catch(e){}

      if(!response.ok){

        throw new Error(
          data?.error ||
          data?.message ||
          (
            'Erro HTTP ' +
            response.status
          )
        );
      }

    }catch(error){

      console.error(
        'Upload fundo:',
        error
      );

      alert(
        'Não foi possível salvar "' +
        file.name +
        '".\n\n' +
        (
          error.message ||
          error
        )
      );
    }
  }

  if(status){

    status.textContent =
      '✅ Upload concluído.';
  }

  await loadBackgroundsV52();
}

/* =========================================================
   OUVIR
========================================================= */

window.capPlayBackgroundV52 =
  function(id){

    try{

      if(fundoTocandoV52){

        fundoTocandoV52.pause();

        fundoTocandoV52.currentTime =
          0;
      }

    }catch(e){}

    fundoTocandoV52 =
      new Audio(
        SERVER +
        '/api/media/' +
        encodeURIComponent(id)
      );

    fundoTocandoV52
      .play()
      .catch(error=>{

        console.error(
          'Ouvir fundo:',
          error
        );

        alert(
          'Não foi possível tocar este fundo.'
        );
      });
  };

/* =========================================================
   EXCLUIR
========================================================= */

window.capDeleteBackgroundV52 =
  async function(id){

    if(
      !confirm(
        'Excluir este fundo de locução?'
      )
    ){
      return;
    }

    const status =
      document.getElementById(
        'capBgStatusV52'
      );

    if(status){
      status.textContent =
        'Excluindo fundo...';
    }

    try{

      await apiV52(
        '/api/admin/media/' +
        encodeURIComponent(id),
        {
          method:'DELETE'
        }
      );

      await loadBackgroundsV52();

    }catch(error){

      console.error(
        'Excluir fundo:',
        error
      );

      alert(
        'Não foi possível excluir.\n\n' +
        (
          error.message ||
          error
        )
      );

      if(status){
        status.textContent =
          '❌ Erro ao excluir.';
      }
    }
  };

/* =========================================================
   SUBSTITUI FUNÇÕES ANTIGAS DE FUNDO
========================================================= */

window.addBackgroundV9 =
  async function(files){

    const arr =
      [
        ...(
          files ||
          []
        )
      ];

    if(!arr.length){
      return;
    }

    await uploadBackgroundsV52(
      arr
    );
  };

window.deleteBgV9 =
  async function(id){

    await window
      .capDeleteBackgroundV52(
        id
      );
  };

/* =========================================================
   ABA FUNDOS
========================================================= */

if(
  typeof window.showAcTabV9 ===
  'function'
){

  const oldShowAcTabV52 =
    window.showAcTabV9;

  window.showAcTabV9 =
    function(tab){

      oldShowAcTabV52(tab);

      if(
        tab ===
        'backgrounds'
      ){

        ensureBackgroundUiV52();

        loadBackgroundsV52();
      }
    };
}

/* =========================================================
   INIT
========================================================= */

function initV52(){

  ensureBackgroundUiV52();

  loadBackgroundsV52();
}

if(
  document.readyState ===
  'loading'
){

  document.addEventListener(
    'DOMContentLoaded',
    initV52,
    {
      once:true
    }
  );

}else{

  initV52();
}

/* =========================================================
   ATUALIZAÇÃO
========================================================= */

setInterval(
  ()=>{

    const host =
      backgroundsHostV52();

    if(
      host &&
      host.style.display !==
      'none'
    ){
      loadBackgroundsV52();
    }

  },
  60000
);

window.capLoadBackgroundsV52 =
  loadBackgroundsV52;

})();
</script>
